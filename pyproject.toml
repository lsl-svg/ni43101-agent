[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ni43101-agent"
version = "0.1.0"
description = "NI 43-101 mineral resource extraction agent: Extractor + CriticMaster + Revise Loop + Evolution Log"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "openai>=1.30",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "pdfplumber>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["out", "out_ablation", "data"]

[tool.ruff.lint]
# E/F：语法与未定义名；I：import 排序；B：常见 bug 模式；UP：现代化写法
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 行长由 formatter 控制

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # 测试里需要先 sys.path.insert 再 import

